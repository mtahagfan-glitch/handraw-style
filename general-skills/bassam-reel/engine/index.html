<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Reel</title>
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#000}
body{font-family:'IBM Plex Sans Arabic',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#000}
.sc{position:absolute;inset:0;overflow:hidden;display:none;will-change:transform,filter}
.ab{position:absolute}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.num{direction:ltr;unicode-bidi:isolate;font-feature-settings:"tnum" 1}
.ltr{direction:ltr;unicode-bidi:isolate}
.cover{width:100%;height:100%;object-fit:cover;display:block}
#chrome{position:absolute;inset:0;pointer-events:none;z-index:50}
#chrome .t{position:absolute;white-space:nowrap}
#chrome .rule{position:absolute;height:1px}
#grain{position:absolute;inset:0;z-index:60;pointer-events:none;mix-blend-mode:overlay}
#flash{position:absolute;inset:0;z-index:70;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;z-index:80;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<script src="data.js"></script>
<script src="engine.js"></script>
</body>
</html>
